name: Build and Deploy Frontend - AegisAI

on:
  push:
    branches:
      - main
    paths:
      - 'voice-live-universal-assistant/frontend/**'
      - '.github/workflows/frontend_deploy.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build React Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        working-directory: voice-live-universal-assistant/frontend
        run: pnpm install

      - name: Build frontend
        working-directory: voice-live-universal-assistant/frontend
        env:
          VITE_BACKEND_URL: https://aegisai-hucpdtcvfxd2dnbs.westus3-01.azurewebsites.net
        run: pnpm build

      - name: Include server.js for Node Web App hosting
        working-directory: voice-live-universal-assistant/frontend
        run: |
          cp server.js dist/
          cp package.json dist/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: voice-live-universal-assistant/frontend/dist/

  deploy-static-web-app:
    name: Deploy to Azure Static Web Apps
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: './dist'
          output_location: ''
          skip_app_build: true

  deploy-web-app:
    name: Deploy to Azure Web App (App Service)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_96C7700EBF964395AC570D8AFC235B28 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_358B791DEA35497F9C6A47E2DAEFCE04 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D214B478741748C7AB1EDFD4251D72B7 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'AegisAI-Frontend'
          slot-name: 'Production'
          package: ./dist
