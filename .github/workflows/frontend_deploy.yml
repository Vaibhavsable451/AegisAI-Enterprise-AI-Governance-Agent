name: Build and Deploy Frontend to Azure Web App - AegisAI-Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'voice-live-universal-assistant/frontend/**'
      - '.github/workflows/frontend_deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: voice-live-universal-assistant/frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend
        working-directory: voice-live-universal-assistant/frontend
        env:
          VITE_BACKEND_URL: https://aegisai-hucpdtcvfxd2dnbs.westus3-01.azurewebsites.net
        run: npm run build

      - name: Prepare dist package for Azure
        working-directory: voice-live-universal-assistant/frontend
        run: |
          cp server.js dist/
          echo '{"name":"voicelive-web-frontend","private":true,"version":"1.0.0","type":"module","main":"server.js","scripts":{"start":"node server.js"}}' > dist/package.json

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_96C7700EBF964395AC570D8AFC235B28 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_358B791DEA35497F9C6A47E2DAEFCE04 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D214B478741748C7AB1EDFD4251D72B7 }}

      - name: Configure Azure App Service Settings
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp config appsettings set --name aegisai-frontend-h7aha4ephncxhvg3 --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'aegisai-frontend-h7aha4ephncxhvg3'
          slot-name: 'Production'
          package: voice-live-universal-assistant/frontend/dist

