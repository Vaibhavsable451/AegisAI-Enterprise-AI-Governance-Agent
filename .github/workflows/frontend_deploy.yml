name: Build and Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - 'voice-live-universal-assistant/frontend/**'
      - '.github/workflows/frontend_deploy.yml'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy AegisAI Frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        working-directory: voice-live-universal-assistant/frontend
        run: pnpm install

      - name: Build frontend
        working-directory: voice-live-universal-assistant/frontend
        env:
          VITE_BACKEND_URL: https://aegisai-hucpdtcvfxd2dnbs.westus3-01.azurewebsites.net
        run: pnpm build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'voice-live-universal-assistant/frontend'
          output_location: 'dist'
          skip_app_build: true
